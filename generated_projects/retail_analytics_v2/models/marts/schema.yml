version: 2

models:
  - name: dim_customers
    description: "Conformed customer dimension joining sanitized customer attributes with customer lifetime order metrics."
    columns:
      - name: customer_id
        description: "Unique identifier of the customer."
        data_type: NUMBER(38,0)
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Standardized first name of the customer."
        data_type: TEXT(300)
        tests:
          - not_null
      - name: last_name
        description: "Standardized last name of the customer."
        data_type: TEXT(300)
        tests:
          - not_null
      - name: email
        description: "Normalized email address of the customer."
        data_type: TEXT(255)
      - name: created_at
        description: "Original account creation timestamp."
        data_type: TIMESTAMP_NTZ
        tests:
          - not_null
      - name: total_orders
        description: "Lifetime count of orders placed by the customer."
        data_type: NUMBER(18,0)
        tests:
          - not_null
      - name: total_spend
        description: "Lifetime aggregate monetary spend across all orders."
        data_type: NUMBER(22,2)
        tests:
          - not_null
      - name: standard_timestamp
        description: "Timestamp tracking transformation execution or record refresh in local timezone."
        data_type: TIMESTAMP_LTZ
        tests:
          - not_null

  - name: fct_orders
    description: "Transactional sales fact table capturing order amounts, customer metadata, and completion status flags."
    columns:
      - name: order_id
        description: "Unique identifier of the order transaction."
        data_type: NUMBER(38,0)
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Identifier of the customer who completed or initiated the order."
        data_type: NUMBER(38,0)
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_date
        description: "Transaction date of the order."
        data_type: DATE
        tests:
          - not_null
      - name: status
        description: "Standardized order status."
        data_type: TEXT(50)
        tests:
          - not_null
          - accepted_values:
              values: ['PENDING', 'COMPLETED', 'CANCELLED', 'pending', 'completed', 'cancelled']
      - name: total_amount
        description: "Total monetary amount for the order transaction."
        data_type: NUMBER(10,2)
        tests:
          - not_null
      - name: is_completed
        description: "Boolean flag indicating whether status is COMPLETED."
        data_type: BOOLEAN
        tests:
          - not_null
      - name: standard_timestamp
        description: "Timestamp tracking transformation execution or record refresh in local timezone."
        data_type: TIMESTAMP_LTZ
        tests:
          - not_null
