version: 2

models:
  - name: int_customers__aggregated_orders
    description: "Customer-level rollups computing lifetime order count, total gross spend, first order date, and most recent order date."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_type: NUMBER(38,0)
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_ecom__customers')
              field: customer_id
      - name: total_orders
        description: "Lifetime count of orders placed by the customer."
        data_type: NUMBER(38,0)
        tests:
          - not_null
      - name: total_spend
        description: "Lifetime aggregate monetary spend across all orders, coalesced to 0.00."
        data_type: NUMBER(22,2)
        tests:
          - not_null
      - name: first_order_date
        description: "Date of the customer's very first order."
        data_type: DATE
      - name: most_recent_order_date
        description: "Date of the customer's most recent order."
        data_type: DATE
